[project]
name = "autograph"
version = "0.1.0"
description = "Zero-trust provenance framework for digital artifacts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Autograph Contributors"}
]
keywords = ["provenance", "attribution", "code-analysis", "ml", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "tree-sitter>=0.21.3",
    "tree-sitter-python>=0.21.0",
    "scikit-learn>=1.7.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
xgboost = [
    "xgboost>=2.0.0",
]

#[project.urls]
#Homepage = "TBD"
#Repository = "TBD"
#Documentation = "TBD"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["autograph-ds/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"
pythonpath = "autograph-ds"
markers = [
    "unit: Quick tests for code logic and bug coverage.",
    "benchmark: Heavier tests that run model validation and report metrics.",
]
